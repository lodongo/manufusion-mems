name: Governance validation (no deployment)

on:
  push:
    branches: [develop]
    paths:
      - 'scripts/future-route-check.mjs'
      - 'tests/independent/future-route-check.test.mjs'
      - 'backend/governanceCutoverCoverage.ts'
      - 'backend/governanceCutoverCoverage.test.ts'
      - 'backend/unifiedApprovalRoutes.ts'
      - 'backend/unifiedApprovalProof.ts'
      - 'backend/unifiedApprovalProof.test.ts'
      - 'backend/unifiedGovernanceRuntime.ts'
      - 'backend/unifiedGovernanceRuntime.test.ts'
      - 'backend/guards.ts'
      - 'backend/platformTransactionRoutes.ts'
      - 'src/admin/TransactionManager.tsx'
      - 'src/admin/AdminShell.tsx'
      - 'backend/transactionRuntime.ts'
      - 'backend/transactionRuntime.test.ts'
      - 'backend/transactionModuleGate.ts'
      - 'backend/transactionModuleGate.test.ts'
      - 'backend/existingPermissionCrosswalk.test.ts'
      - 'Dockerfile'
      - 'scripts/prod-preflight.mjs'
      - '.github/workflows/deploy-production.yml'
      - 'backend/governanceCore.ts'
      - 'backend/governanceCore.test.ts'
      - 'backend/transactionRegistry.ts'
      - 'backend/transactionEndpointMapping.ts'
      - 'backend/transactionEndpointMapping.test.ts'
      - 'backend/transactionAccessBoundary.ts'
      - 'backend/transactionAccessBoundary.test.ts'
      - 'backend/existingPermissionCrosswalk.ts'
      - 'src/components/SearchableSelect.tsx'
      - 'backend/transactionBlueprints.ts'
      - 'backend/transactionBlueprintRoutes.ts'
      - 'src/org/UnifiedApprovalInbox.tsx'
      - 'src/org/WorkflowInbox.tsx'
      - 'src/org/TransactionBlueprints.tsx'
      - 'backend/permissionPolicy.ts'
      - 'backend/audit.ts'
      - 'backend/governanceAuditRoutes.ts'
      - 'backend/governanceDocumentRoutes.ts'
      - 'backend/governanceDocumentation.ts'
      - 'backend/index.ts'
      - 'src/org/GovernanceReports.tsx'
      - 'src/org/TransactionGovernance.tsx'
      - 'src/org/OrgShell.tsx'
      - 'scripts/governance-route-audit.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/governance-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # The repository currently has no npm lockfile. Do not enable setup-node npm cache or npm ci until a reviewed lockfile is committed.
      - run: npm install --no-audit --no-fund
      - run: npm run check
      - run: npm run audit:routes
      - run: npm run audit:future-routes
      - run: npm run test:governance
      - run: npm run build
