name: Maintenance governance validation
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: maintenance-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record pending validation status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'mems/maintenance-phase2-validation',
              description: 'Maintenance governance checks in progress',
              target_url: context.payload.repository.html_url + '/actions/runs/' + context.runId
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Maintenance governance and access regression tests
        run: node --import tsx --test backend/maintenanceGovernancePolicy.test.ts backend/maintenanceCleanupAuthorization.test.ts tests/independent/maintenance-gate-access.test.mjs
      - name: Shared approval-engine regression tests
        run: npm run test:governance
      - run: npm run build
      - name: Report validation result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status === 'success' ? 'success' : status === 'cancelled' ? 'error' : 'failure',
              context: 'mems/maintenance-phase2-validation',
              description: status === 'success' ? 'Type checks, tests and build passed' : 'Maintenance validation ' + status,
              target_url: context.payload.repository.html_url + '/actions/runs/' + context.runId
            })
