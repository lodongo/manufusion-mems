name: Maintenance governance validation
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: maintenance-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Record pending validation status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: 'pending',
              context: 'mems/maintenance-phase2-validation',
              description: 'Maintenance governance checks in progress',
              target_url: context.payload.repository.html_url + '/actions/runs/' + context.runId
            })
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Asset catalog import safety and mobile transfer regression
        run: node --import tsx --test tests/independent/asset-catalog-import.test.mjs
      - name: PRC material registry workflow and organization-wide extension regression
        run: node --import tsx --test tests/independent/prc-material-workflow-registry.test.mjs
      - name: PRC multi-restriction cluster matching and draft handoff regression
        run: node --import tsx --test tests/independent/prc-material-cluster-matching.test.mjs
      - name: PRC Bidded material sourcing regression
        run: node --import tsx --test tests/independent/prc-bidded-sourcing.test.mjs
      - name: PRC Materials Master classification and attribute regression
        run: node --import tsx --test tests/independent/prc-material-master-wizard.test.mjs
      - name: Warehouse location subcategory mapping regression
        run: node --import tsx --test tests/independent/warehouse-location-subcategories.test.mjs
      - name: Maintenance governance and access regression tests
        run: node --import tsx --test backend/maintenanceReliabilityCore.test.ts backend/maintenanceCostCore.test.ts backend/maintenanceResourceLeveling.test.ts backend/maintenanceTimesheetCore.test.ts backend/maintenanceStandardHistory.test.ts backend/maintenanceTimeCore.test.ts backend/maintenanceCapacity.test.ts backend/maintenanceAnalytics.test.ts backend/maintenanceApprovalFlow.test.ts backend/maintenanceGovernancePolicy.test.ts backend/maintenanceCleanupAuthorization.test.ts tests/independent/maintenance-gate-access.test.mjs
      - name: Shared approval-engine regression tests
        run: npm run test:governance
      - name: SKU bulk containment and optional packaging regression tests
        run: npm run test:sku-containment
      - run: npm run build
      - name: Report validation result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const status = '${{ job.status }}'
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status === 'success' ? 'success' : status === 'cancelled' ? 'error' : 'failure',
              context: 'mems/maintenance-phase2-validation',
              description: status === 'success' ? 'Type checks, tests and build passed' : 'Maintenance validation ' + status,
              target_url: context.payload.repository.html_url + '/actions/runs/' + context.runId
            })
