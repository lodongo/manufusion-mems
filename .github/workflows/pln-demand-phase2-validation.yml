name: PLN Phase 2 demand validation
on:
  push:
    branches: [develop]
    paths:
      - 'backend/plnDemand.ts'
      - 'backend/index.ts'
      - 'src/org/PlnDemand.tsx'
      - 'src/org/ProductionFoundation.tsx'
      - 'tests/independent/pln-demand-phase2.test.mjs'
      - '.github/workflows/pln-demand-phase2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and repository checks
        run: npm run check
      - name: Frontend build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-fixture-not-real
          VITE_FIREBASE_AUTH_DOMAIN: mems-dev-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mems-dev-ci
          VITE_FIREBASE_STORAGE_BUCKET: mems-dev-ci.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          VITE_FIREBASE_APP_ID: 1:123456789012:web:ci-fixture
      - name: Phase 2 demand validation
        run: node --import tsx --test tests/independent/pln-demand-phase2.test.mjs
      - name: Acceptance limitations
        run: |
          echo "Code-only Phase 2 demand checks passed."
          echo "Authenticated tenant CRUD, maker-checker accounts and Firestore require development-tenant acceptance."
          echo "Excel import, S&OP reconciliation, MPS, capacity and MRP remain separate phases."
