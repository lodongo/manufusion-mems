name: Build MEMS DEV Android APK

on:
  push:
    branches: [develop]
    paths:
      - 'android-dev-wrapper/**'
      - '.github/workflows/build-mems-dev-android.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build development APK with native file picker
        run: gradle -p android-dev-wrapper :app:assembleDebug --no-daemon --stacktrace
      - name: Publish installable development APK
        uses: actions/upload-artifact@v4
        with:
          name: Manufusion-MEMS-DEV-Android-FileChooser
          path: android-dev-wrapper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
