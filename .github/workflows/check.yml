name: MEMS independent validation
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run check
      # Public, fake Firebase Web-app values for test bundles only.
      # These are not real credentials, and runtime tests never call Firebase.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-fixture-not-real
          VITE_FIREBASE_AUTH_DOMAIN: mems-dev-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mems-dev-ci
          VITE_FIREBASE_STORAGE_BUCKET: mems-dev-ci.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          VITE_FIREBASE_APP_ID: 1:123456789012:web:ci-fixture
      - run: npm run test:drkms
      - run: npm run test:hr
      - run: npm run audit:routes:strict
      - run: npm run test:governance
      - run: npm run test:corporate
      - run: node --import tsx --test tests/independent/*.test.mjs automation/test/*.test.mjs

  # Only a fully green, current develop commit may dispatch the isolated development
  # workflow. GitHub's workflow_dispatch exception allows GITHUB_TOKEN to start it.
  # This does NOT expand Google Cloud WIF credentials or give MEMS website visitors deploy keys.
  deploy-on-green:
    needs: code-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'lodongo/manufusion-mems'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    concurrency:
      group: mems-dev-green-dispatch
      cancel-in-progress: true
    steps:
      - name: Dispatch the verified current develop branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api repos/lodongo/manufusion-mems/branches/develop --jq '.commit.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping stale CI commit; develop has advanced to $current"
            exit 0
          fi
          gh api -X POST repos/lodongo/manufusion-mems/actions/workflows/deploy-development.yml/dispatches -f ref=develop
          echo "Triggered manual-gated development deployment for $GITHUB_SHA"
