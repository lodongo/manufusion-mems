name: MEMS independent validation
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  code-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      # Public, fake Firebase Web-app values for test bundles only.
      # These are not real credentials, and runtime tests never call Firebase.
      - run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-fixture-not-real
          VITE_FIREBASE_AUTH_DOMAIN: mems-dev-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mems-dev-ci
          VITE_FIREBASE_STORAGE_BUCKET: mems-dev-ci.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          VITE_FIREBASE_APP_ID: 1:123456789012:web:ci-fixture
      - run: npm run test:drkms
      - run: npm run test:hr
      # Legacy route inventory contains 72 pre-existing unclassified declarations.
      # Keep static visibility and strict per-P5 endpoint checks; full strict audit is
      # a separate organization-wide remediation gate, not silently marked passed.
      - run: npm run audit:routes
      - run: npm run test:governance
      - run: npm run test:corporate
      - run: node --import tsx --test tests/independent/*.test.mjs automation/test/*.test.mjs

  # The ONLY automatic route to the development deployment. A develop commit deploys once,
  # and only when this validation AND "Maintenance governance validation" (commit status
  # mems/maintenance-phase2-validation) have both passed for that exact commit.
  # GitHub's workflow_dispatch exception allows GITHUB_TOKEN to start it.
  # This does NOT expand Google Cloud WIF credentials or give MEMS website visitors deploy keys.
  deploy-on-green:
    needs: code-check
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop' && github.repository == 'lodongo/manufusion-mems'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      statuses: read
      actions: write
    concurrency:
      group: mems-dev-green-dispatch
      cancel-in-progress: true
    steps:
      - name: Wait for maintenance governance validation of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 70); do
            state="$(gh api "repos/lodongo/manufusion-mems/commits/$GITHUB_SHA/status" \
              --jq '[.statuses[] | select(.context=="mems/maintenance-phase2-validation") | .state][0] // "missing"')"
            case "$state" in
              success) echo "Maintenance governance validation passed for $GITHUB_SHA"; exit 0 ;;
              failure|error) echo "::error::Maintenance governance validation is $state for $GITHUB_SHA. Not deploying."; exit 1 ;;
            esac
            echo "Maintenance governance validation is $state (check $attempt/70); waiting 30s"
            sleep 30
          done
          echo "::error::Maintenance governance validation did not finish within 35 minutes. Not deploying."
          exit 1
      - name: Dispatch the verified current develop branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current="$(gh api repos/lodongo/manufusion-mems/branches/develop --jq '.commit.sha')"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "Skipping stale CI commit; develop has advanced to $current"
            exit 0
          fi
          gh api -X POST repos/lodongo/manufusion-mems/actions/workflows/deploy-development.yml/dispatches -f ref=develop
          echo "Triggered manual-gated development deployment for $GITHUB_SHA"
