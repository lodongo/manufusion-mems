name: PLN-MFG Phase 1 validation
on:
  push:
    branches: [develop]
    paths:
      - 'backend/plnMfg*.ts'
      - 'backend/plnDemand.ts'
      - 'src/org/PlnDemand.tsx'
      - 'tests/independent/pln-demand-phase2.test.mjs'
      - 'backend/mfgMaterialPolicy.ts'
      - 'backend/mfgSku*.ts'
      - 'backend/mfgPrimaryContainerMetadata.ts'
      - 'backend/mfgPackagingMetadata.ts'
      - 'src/admin/MfgPackagingMetadataBrowser.tsx'
      - 'backend/moduleDefaults.ts'
      - 'src/admin/ModulesPage.tsx'
      - 'src/admin/MfgContainerMetadataBrowser.tsx'
      - 'src/shared/mfgSkuNaming.ts'
      - 'src/org/MfgSkuSetup.tsx'
      - 'backend/index.ts'
      - 'backend/permissionPolicy.ts'
      - 'src/org/ProductionFoundation.tsx'
      - 'src/org/OrgShell.tsx'
      - 'src/org/OrgHomePage.tsx'
      - 'tests/independent/pln-mfg-foundation.test.mjs'
      - '.github/workflows/pln-mfg-phase1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript and repository checks
        run: npm run check
      - name: Frontend build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-fixture-not-real
          VITE_FIREBASE_AUTH_DOMAIN: mems-dev-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mems-dev-ci
          VITE_FIREBASE_STORAGE_BUCKET: mems-dev-ci.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          VITE_FIREBASE_APP_ID: 1:123456789012:web:ci-fixture
      - name: Phase 1 manufacturing master, pilot isolation and maker-checker tests
        run: node --import tsx --test tests/independent/pln-mfg-foundation.test.mjs
      - name: Acceptance limitation
        run: |
          echo "Code, build and pure Phase 1 tests passed."
          echo "Authenticated CRUD, role-scoped tenant UI and Firestore persistence still require manual development tenant acceptance."
          echo "General MEMS regression is tracked separately; do not treat this focused workflow as a replacement."
