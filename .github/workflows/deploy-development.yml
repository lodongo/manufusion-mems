name: Deploy MEMS to isolated development Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mems-development-cloudrun
  cancel-in-progress: false

jobs:
  deploy-development:
    if: github.ref == 'refs/heads/develop' && github.repository == 'lodongo/manufusion-mems'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      GCP_DEV_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
      MEMS_FIREBASE_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
      GCP_DEV_REGION: ${{ vars.GCP_DEV_REGION }}
      GCP_DEV_WIF_PROVIDER: ${{ vars.GCP_DEV_WIF_PROVIDER }}
      GCP_DEV_DEPLOYER_SA: ${{ vars.GCP_DEV_DEPLOYER_SA }}
      GCP_DEV_RUNTIME_SA: ${{ vars.GCP_DEV_RUNTIME_SA }}
      MEMS_STORAGE_BUCKET: ${{ vars.MEMS_STORAGE_BUCKET }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify development-only target
        run: |
          set -euo pipefail
          node scripts/dev-preflight.mjs deploy
          test "${GITHUB_REF}" = 'refs/heads/develop'

      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate application before deployment
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build

      - name: Verify backend can boot and serve /health before container push
        shell: bash
        run: |
          set -euo pipefail
          export PORT=18080
          node --import tsx backend/platform/server.ts >"$RUNNER_TEMP/mems-startup.log" 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:18080/health >"$RUNNER_TEMP/mems-boot-health.json"; then
              cat "$RUNNER_TEMP/mems-boot-health.json"
              echo 'Backend HTTP boot smoke test passed'
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo 'Backend process exited before opening port:'
              cat "$RUNNER_TEMP/mems-startup.log"
              exit 1
            fi
            sleep 1
          done
          echo 'Backend did not serve port 18080 in time'
          cat "$RUNNER_TEMP/mems-startup.log"
          exit 1

      - name: Build, push and deploy MEMS development service
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_DEV_REGION}-docker.pkg.dev/${GCP_DEV_PROJECT_ID}/mems-dev/mems:${GITHUB_SHA}"
          gcloud auth configure-docker "${GCP_DEV_REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg "GCP_DEV_PROJECT_ID=${GCP_DEV_PROJECT_ID}" \
            --build-arg "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}" \
            --build-arg "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}" \
            --build-arg "VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}" \
            --build-arg "VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}" \
            --build-arg "VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}" \
            -t "${IMAGE}" .
          # Exercise the final production-stage image, not the repository tree.
          # This catches runtime files missing from Docker COPY (e.g. src/shared).
          SMOKE_ID="$(docker run --rm -d -p 127.0.0.1:18081:8080 \
            -e PORT=8080 -e MEMS_FIREBASE_PROJECT_ID="${MEMS_FIREBASE_PROJECT_ID}" \
            -e MEMS_STORAGE_BUCKET="${MEMS_STORAGE_BUCKET}" "${IMAGE}")"
          smoke_cleanup() { docker logs "${SMOKE_ID}" 2>&1 | tail -80 || true; docker stop "${SMOKE_ID}" >/dev/null 2>&1 || true; }
          trap smoke_cleanup EXIT
          READY=0
          for i in $(seq 1 35); do
            if curl --fail --silent http://127.0.0.1:18081/health >"$RUNNER_TEMP/mems-image-health.json"; then
              READY=1
              echo 'Cloud Run image HTTP boot verified before upload'
              break
            fi
            if [ "$(docker inspect --format='{{.State.Running}}' "${SMOKE_ID}" 2>/dev/null)" != true ]; then
              echo 'Production-stage container exited before serving /health'
              docker logs "${SMOKE_ID}" 2>&1 | tail -100
              exit 1
            fi
            sleep 1
          done
          if [ "${READY}" != 1 ]; then
            echo 'Production-stage image never served /health'
            docker logs "${SMOKE_ID}" 2>&1 | tail -100
            exit 1
          fi
          docker stop "${SMOKE_ID}" >/dev/null 2>&1 || true
          trap - EXIT
          docker push "${IMAGE}"
          gcloud run deploy mems-dev \
            --project="${GCP_DEV_PROJECT_ID}" \
            --region="${GCP_DEV_REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --service-account="${GCP_DEV_RUNTIME_SA}" \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=20 \
            --timeout=120 \
            --update-env-vars="MEMS_FIREBASE_PROJECT_ID=${MEMS_FIREBASE_PROJECT_ID},MEMS_STORAGE_BUCKET=${MEMS_STORAGE_BUCKET},MEMS_DEPLOY_SHA=${GITHUB_SHA}" \
            --quiet
          URL="$(gcloud run services describe mems-dev --project="${GCP_DEV_PROJECT_ID}" --region="${GCP_DEV_REGION}" --format='value(status.url)')"
          test -n "$URL"
          gcloud run services update mems-dev \
            --project="${GCP_DEV_PROJECT_ID}" \
            --region="${GCP_DEV_REGION}" \
            --update-env-vars="MEMS_PUBLIC_URL=$URL/" \
            --quiet
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "$URL/health" > "$RUNNER_TEMP/mems-development-health.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const health = JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/mems-development-health.json", "utf8"));
            if (health.ok !== true || health.revision !== process.env.GITHUB_SHA) {
              throw new Error("Development health or deployed revision does not match the verified commit");
            }
            console.log("Verified healthy development revision " + health.revision);
          '
          {
            echo '### MEMS isolated development Cloud Run'
            echo "Project: ${GCP_DEV_PROJECT_ID}"
            echo "Region: ${GCP_DEV_REGION}"
            echo "Cloud Run URL: ${URL}"
            echo 'Access: governed by Cloud Run service security settings, managed separately in the Google Cloud Console'
            echo 'No live Firebase project has been used.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose failed Cloud Run revision
        if: failure()
        shell: bash
        run: |
          set +e
          if command -v gcloud >/dev/null 2>&1 && [ -n "${GCP_DEV_PROJECT_ID:-}" ]; then
            echo 'Recent Cloud Run startup errors (redacted log sampling):'
            gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="mems-dev" AND severity>=ERROR' \
              --project="$GCP_DEV_PROJECT_ID" --freshness=20m --limit=12 \
              --format='value(timestamp,textPayload,jsonPayload.message)' | tail -120
          fi

