name: Deploy MEMS to isolated development Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mems-development-cloudrun
  cancel-in-progress: false

jobs:
  deploy-development:
    if: github.ref == 'refs/heads/develop' && github.repository == 'lodongo/manufusion-mems'
    runs-on: ubuntu-latest
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      GCP_DEV_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
      MEMS_FIREBASE_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
      GCP_DEV_REGION: ${{ vars.GCP_DEV_REGION }}
      GCP_DEV_WIF_PROVIDER: ${{ vars.GCP_DEV_WIF_PROVIDER }}
      GCP_DEV_DEPLOYER_SA: ${{ vars.GCP_DEV_DEPLOYER_SA }}
      GCP_DEV_RUNTIME_SA: ${{ vars.GCP_DEV_RUNTIME_SA }}
      MEMS_STORAGE_BUCKET: ${{ vars.MEMS_STORAGE_BUCKET }}
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify development-only target
        run: |
          set -euo pipefail
          node scripts/dev-preflight.mjs deploy
          test "${GITHUB_REF}" = 'refs/heads/develop'

      - name: Authenticate to Google Cloud without a service account key
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Validate application before deployment
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build

      - name: Build, push and deploy MEMS development service
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${GCP_DEV_REGION}-docker.pkg.dev/${GCP_DEV_PROJECT_ID}/mems-dev/mems:${GITHUB_SHA}"
          gcloud auth configure-docker "${GCP_DEV_REGION}-docker.pkg.dev" --quiet
          docker build \
            --build-arg "GCP_DEV_PROJECT_ID=${GCP_DEV_PROJECT_ID}" \
            --build-arg "VITE_FIREBASE_API_KEY=${VITE_FIREBASE_API_KEY}" \
            --build-arg "VITE_FIREBASE_AUTH_DOMAIN=${VITE_FIREBASE_AUTH_DOMAIN}" \
            --build-arg "VITE_FIREBASE_PROJECT_ID=${VITE_FIREBASE_PROJECT_ID}" \
            --build-arg "VITE_FIREBASE_STORAGE_BUCKET=${VITE_FIREBASE_STORAGE_BUCKET}" \
            --build-arg "VITE_FIREBASE_MESSAGING_SENDER_ID=${VITE_FIREBASE_MESSAGING_SENDER_ID}" \
            --build-arg "VITE_FIREBASE_APP_ID=${VITE_FIREBASE_APP_ID}" \
            -t "${IMAGE}" .
          docker push "${IMAGE}"
          gcloud run deploy mems-dev \
            --project="${GCP_DEV_PROJECT_ID}" \
            --region="${GCP_DEV_REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --service-account="${GCP_DEV_RUNTIME_SA}" \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=20 \
            --timeout=120 \
            --update-env-vars="MEMS_FIREBASE_PROJECT_ID=${MEMS_FIREBASE_PROJECT_ID},MEMS_STORAGE_BUCKET=${MEMS_STORAGE_BUCKET},MEMS_DEPLOY_SHA=${GITHUB_SHA}" \
            --quiet
          URL="$(gcloud run services describe mems-dev --project="${GCP_DEV_PROJECT_ID}" --region="${GCP_DEV_REGION}" --format='value(status.url)')"
          test -n "$URL"
          gcloud run services update mems-dev \
            --project="${GCP_DEV_PROJECT_ID}" \
            --region="${GCP_DEV_REGION}" \
            --update-env-vars="MEMS_PUBLIC_URL=$URL/" \
            --quiet
          {
            echo '### MEMS isolated development Cloud Run'
            echo "Project: ${GCP_DEV_PROJECT_ID}"
            echo "Region: ${GCP_DEV_REGION}"
            echo "Cloud Run URL: ${URL}"
            echo 'Access: governed by Cloud Run service security settings, managed separately in the Google Cloud Console'
            echo 'No live Firebase project has been used.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish separate public MEMS live pilot using development Firebase
        shell: bash
        run: |
          set -euo pipefail
          # This is an intentionally PUBLIC pilot deployment, not the production
          # Firebase project. It reuses the green, pinned development image.
          node scripts/dev-preflight.mjs deploy
          IMAGE="${GCP_DEV_REGION}-docker.pkg.dev/${GCP_DEV_PROJECT_ID}/mems-dev/mems:${GITHUB_SHA}"
          gcloud run deploy mems-live \
            --project="${GCP_DEV_PROJECT_ID}" \
            --region="${GCP_DEV_REGION}" \
            --image="${IMAGE}" \
            --platform=managed \
            --service-account="${GCP_DEV_RUNTIME_SA}" \
            --allow-unauthenticated \
            --min-instances=0 \
            --max-instances=2 \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=20 \
            --timeout=120 \
            --update-env-vars="MEMS_FIREBASE_PROJECT_ID=${MEMS_FIREBASE_PROJECT_ID},MEMS_STORAGE_BUCKET=${MEMS_STORAGE_BUCKET},MEMS_DEPLOY_SHA=${GITHUB_SHA},MEMS_DEPLOY_MODE=live-pilot" \
            --quiet
          LIVE_URL="$(gcloud run services describe mems-live --project="${GCP_DEV_PROJECT_ID}" --region="${GCP_DEV_REGION}" --format='value(status.url)')"
          test -n "${LIVE_URL}"
          gcloud run services update mems-live \
            --project="${GCP_DEV_PROJECT_ID}" \
            --region="${GCP_DEV_REGION}" \
            --update-env-vars="MEMS_PUBLIC_URL=${LIVE_URL}/" \
            --quiet
          curl --fail --silent --show-error --retry 6 --retry-delay 5 "${LIVE_URL}/healthz" > /tmp/mems-pilot-health.json
          STATUS="$(curl --silent --show-error -X POST -H 'Content-Type: application/json' \
            -d '{}' -o /tmp/mems-pilot-probe.json -w '%{http_code}' \
            "${LIVE_URL}/api/org/governance/cutover/status")"
          test "${STATUS}" = '401'
          {
            echo '### MEMS public live pilot'
            echo "URL: ${LIVE_URL}"
            echo "Pinned source: ${GITHUB_SHA}"
            echo "Google Cloud project: ${GCP_DEV_PROJECT_ID}"
            echo '**Data: development Firebase/Firestore, not isolated production.**'
            echo 'Public landing page verified; unauthenticated business API rejected (401).'
          } >> "$GITHUB_STEP_SUMMARY"
