name: PLN cost-centre SKU commissioning validation
on:
  push:
    branches: [develop]
    paths:
      - 'backend/plnCostCenterCapacity.ts'
      - 'backend/plnPhysicalCapacity.ts'
      - 'src/shared/throughputOutput.ts'
      - 'src/org/PlnDocumentation.tsx'
      - 'src/org/PlnSkuCostCenterRatings.tsx'
      - 'tests/independent/pln-documentation-throughput.test.mjs'
      - 'backend/mfgSkuModel.ts'
      - 'src/org/MfgSkuSetup.tsx'
      - 'backend/index.ts'
      - 'src/org/PlnCostCenterSetup.tsx'
      - 'src/org/PlnCostCenterSkuSetup.tsx'
      - 'src/org/StructurePage.tsx'
      - 'src/org/ProductionFoundation.tsx'
      - 'src/org/plnFormDefaults.ts'
      - 'src/org/PlnFormDefaultsPanel.tsx'
      - 'src/org/PlnDemand.tsx'
      - 'backend/plnMfgFoundation.ts'
      - 'tests/independent/pln-form-defaults.test.mjs'
      - 'tests/independent/pln-form-defaults-visibility.test.mjs'
      - 'src/org/plnSetupDependencies.ts'
      - 'tests/independent/pln-configuration-dependencies.test.mjs'
      - 'src/org/AssetRegister.tsx'
      - 'src/org/WorkCenterAsset.tsx'
      - 'tests/independent/pln-cost-center-capacity.test.mjs'
      - '.github/workflows/pln-cost-center-capacity-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sku-capacity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript verification
        run: npm run check
      - name: Frontend production build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-fixture-not-real
          VITE_FIREBASE_AUTH_DOMAIN: mems-dev-ci.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: mems-dev-ci
          VITE_FIREBASE_STORAGE_BUCKET: mems-dev-ci.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '123456789012'
          VITE_FIREBASE_APP_ID: 1:123456789012:web:ci-fixture
      - name: Test cost-centre-owned SKU capacity
        run: node --import tsx --test tests/independent/pln-cost-center-capacity.test.mjs tests/independent/pln-documentation-throughput.test.mjs tests/independent/pln-configuration-dependencies.test.mjs tests/independent/pln-form-defaults.test.mjs tests/independent/pln-form-defaults-visibility.test.mjs
      - name: Acceptance limits
        run: |
          echo "Planner and Org Design now share cost-centre SKU configuration."
          echo "Equipment and Asset Register no longer own planning capacity."
          echo "Tenant permission UAT, concurrency, and production scheduling remain to be verified separately."
